<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fart project</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.08) 2px,rgba(0,0,0,0.08) 4px);
            pointer-events: none; z-index: 10;
        }
        .container { text-align: center; padding: 2rem; position: relative; z-index: 1; }
        .statue-wrapper { position: relative; display: inline-block; }
        .statue {
            max-width: 90vw; max-height: 80vh; border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            display: block; margin: 0 auto; position: relative; z-index: 1;
        }
        .statue:active { transform: scale(0.97); }
        .statue:hover { box-shadow: 0 12px 40px rgba(0,0,0,0.7); }
        .glitch-ghost {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 12px; pointer-events: none; z-index: 0;
            background-size: cover; background-position: center; opacity: 0;
        }
        .glitch-ghost--red { background-color: rgba(255,0,0,0.15); mix-blend-mode: screen; }
        .glitch-ghost--blue { background-color: rgba(0,0,255,0.15); mix-blend-mode: screen; }
        .hint { color: #888; margin-top: 1rem; font-size: 0.9rem; opacity: 0.7; }
        #glitchCanvas {
            position: fixed; inset: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
        }
        .bonus-overlay {
            position: fixed; inset: 0; z-index: 20;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none; opacity: 0; transition: opacity 0.3s ease;
        }
        .bonus-overlay.show { opacity: 1; }
        .bonus-overlay img {
            max-width: 70vw; max-height: 70vh; border-radius: 16px;
            box-shadow: 0 0 80px rgba(255,0,0,0.6), 0 0 160px rgba(0,50,255,0.4);
            animation: bonusPulse 0.5s ease-in-out infinite alternate;
        }
        @keyframes bonusPulse {
            from { transform: scale(1); filter: hue-rotate(0deg) contrast(1.2); }
            to { transform: scale(1.05); filter: hue-rotate(30deg) contrast(1.5); }
        }
        .bonus-label {
            position: fixed; bottom: 10%; left: 50%; transform: translateX(-50%);
            z-index: 25; color: #ff3333; font-size: 2.5rem; font-weight: bold;
            text-shadow: 0 0 20px rgba(255,0,0,0.8), 2px 2px 0 #000;
            opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
        }
        .bonus-label.show { opacity: 1; }
        .model-overlay {
            position: fixed; inset: 0; z-index: 30;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        .model-overlay.show { opacity: 1; pointer-events: auto; }
        #modelContainer { width: 80vw; height: 80vh; }
    </style>
</head>
<body>
    <canvas id="glitchCanvas"></canvas>

    <div class="container">
        <div class="statue-wrapper" id="statueWrapper">
            <div class="glitch-ghost glitch-ghost--red" id="ghostRed"></div>
            <div class="glitch-ghost glitch-ghost--blue" id="ghostBlue"></div>
            <img id="statue" class="statue"
                src="https://images.pdimagearchive.org/essays/the-spiralist/b28127833_0294-edit.jpg"
                alt="Statue — click" draggable="false" crossorigin="anonymous" />
        </div>
        <p class="hint" id="hint">👆 click the statue</p>
    </div>

    <div class="bonus-overlay" id="bonusOverlay">
        <img src="https://media.istockphoto.com/id/497185659/de/foto/butt-des-hercules.jpg?s=612x612&w=0&k=20&c=g_qvrcgJlVIrZrNLHD-j4x86Tpnacz5yUAjVRRxRQ1g=" alt="statue butt" />
    </div>
    <div class="bonus-label" id="bonusLabel">🔥 BONUS ROUND 🔥</div>

    <div class="model-overlay" id="modelOverlay">
        <div id="modelContainer"><div id="modelLoading" style="color:#888;text-align:center;padding:40px;font-size:1.2rem;">Loading...</div></div>
    </div>

    <audio id="fartSound" preload="auto" src="https://cdn.freesound.org/previews/833/833105_17959155-lq.mp3"></audio>
    <audio id="bonusSound" preload="auto" src="https://cdn.freesound.org/previews/439/439065_7268008-lq.mp3"></audio>
    <audio id="modelSound" preload="auto" src="https://cdn.freesound.org/previews/529/529010_2346185-lq.mp3"></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
    /* ---- setup ---- */
    const img = document.getElementById('statue');
    const audio = document.getElementById('fartSound');
    const bonusAudio = document.getElementById('bonusSound');
    const modelAudio = document.getElementById('modelSound');
    const ghostRed = document.getElementById('ghostRed');
    const ghostBlue = document.getElementById('ghostBlue');
    const hint = document.getElementById('hint');
    const bonusOverlay = document.getElementById('bonusOverlay');
    const bonusLabel = document.getElementById('bonusLabel');
    const modelOverlay = document.getElementById('modelOverlay');
    const modelContainer = document.getElementById('modelContainer');
    const cvs = document.getElementById('glitchCanvas');
    const ctx = cvs.getContext('2d');

    let W, H;
    function resize() { W = cvs.width = window.innerWidth; H = cvs.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);

    let clickCount = 0;

    /* ---- sparkle particles ---- */
    const sparkles = [];
    for (let i = 0; i < 140; i++) {
        sparkles.push({
            x: Math.random() * W, y: Math.random() * H,
            size: Math.random() * 4 + 1,
            sx: (Math.random() - 0.5) * 3, sy: (Math.random() - 0.5) * 3 + 1,
            life: Math.random() * 60 + 40, maxLife: 0,
            hue: Math.random() > 0.5 ? 0 : 230,
            glitch: false
        });
        sparkles[i].maxLife = sparkles[i].life;
    }

    function resetSparkle(s) {
        s.x = Math.random() * W; s.y = Math.random() * H;
        s.sx = (Math.random() - 0.5) * 3; s.sy = (Math.random() - 0.5) * 3 + 1;
        s.life = Math.random() * 60 + 40; s.maxLife = s.life;
        s.glitch = false;
    }

    function drawSparkles() {
        for (const s of sparkles) {
            s.x += s.sx; s.y += s.sy; s.life--;
            if (Math.random() < 0.005) { s.x += (Math.random() - 0.5) * 200; s.y += (Math.random() - 0.5) * 100; s.glitch = true; }
            else { s.glitch = false; }
            if (s.life <= 0 || s.x < -50 || s.x > W + 50 || s.y < -50 || s.y > H + 50) { resetSparkle(s); }
            const alpha = Math.max(0, s.life / s.maxLife);
            const size = s.glitch ? s.size * 3 : s.size;
            ctx.save();
            ctx.shadowBlur = s.glitch ? 20 : 10;
            ctx.shadowColor = s.hue === 0 ? `rgba(255,0,0,${alpha})` : `rgba(0,100,255,${alpha})`;
            ctx.strokeStyle = s.hue === 0
                ? `rgba(255,${50+Math.random()*50},${50+Math.random()*50},${alpha})`
                : `rgba(${50+Math.random()*50},${100+Math.random()*50},255,${alpha})`;
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(s.x - size, s.y); ctx.lineTo(s.x + size, s.y);
            ctx.moveTo(s.x, s.y - size); ctx.lineTo(s.x, s.y + size); ctx.stroke();
            ctx.fillStyle = s.hue === 0 ? `rgba(255,50,50,${alpha})` : `rgba(50,100,255,${alpha})`;
            ctx.shadowBlur = 0; ctx.beginPath(); ctx.arc(s.x, s.y, size * 0.3, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }
    }

    /* ---- glitch bars ---- */
    function drawGlitchBars() {
        if (Math.random() < 0.02) {
            const y = Math.random() * H, h = Math.random() * 4 + 1;
            const g = ctx.createLinearGradient(0, y, W, y);
            g.addColorStop(0, `rgba(255,0,0,${Math.random()*0.3})`);
            g.addColorStop(0.3, `rgba(255,0,0,0)`);
            g.addColorStop(0.5, `rgba(0,100,255,${Math.random()*0.3})`);
            g.addColorStop(0.7, `rgba(0,100,255,0)`);
            g.addColorStop(1, `rgba(255,0,0,${Math.random()*0.3})`);
            ctx.fillStyle = g; ctx.fillRect(0, y, W, h);
        }
        if (Math.random() < 0.01) {
            const y = Math.random() * H, h = Math.random() * 3 + 1;
            ctx.fillStyle = Math.random() > 0.5 ? `rgba(255,0,0,${Math.random()*0.15})` : `rgba(0,100,255,${Math.random()*0.15})`;
            ctx.fillRect(0, y, W, h);
        }
    }

    /* ---- auto glitch ---- */
    let glitchActive = false;
    function autoGlitch() {
        if (glitchActive) return;
        glitchActive = true;
        const ox = (Math.random() - 0.5) * 20, oy = (Math.random() - 0.5) * 10;
        ghostRed.style.transform = `translate(${ox}px,${oy}px)`;
        ghostBlue.style.transform = `translate(${-ox}px,${-oy}px)`;
        img.style.filter = `hue-rotate(${Math.random()*360}deg) contrast(${1.5+Math.random()*2}) brightness(${1+Math.random()*0.5})`;
        setTimeout(() => {
            glitchActive = false;
            ghostRed.style.transform = ''; ghostBlue.style.transform = '';
            img.style.filter = 'none';
        }, 150 + Math.random() * 200);
    }
    setInterval(() => { if (!glitchActive && Math.random() < 0.4) autoGlitch(); }, 1000 + Math.random() * 3000);

    /* ---- split-spin multi-layer ---- */
    let splitGroups = [];
    let layerCount = 0;

    function captureImage() {
        const rect = img.getBoundingClientRect();
        const os = document.createElement('canvas');
        os.width = rect.width; os.height = rect.height;
        os.getContext('2d').drawImage(img, 0, 0, rect.width, rect.height);
        return { canvas: os, rect };
    }

    function createSplitGroup() {
        const { canvas: offscreenCanvas, rect } = captureImage();
        const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
        const n = 8 + Math.floor(Math.random() * 4);
        const pieces = [];
        for (let i = 0; i < n; i++) {
            const aA = (i / n) * Math.PI * 2, aB = ((i + 1) / n) * Math.PI * 2;
            pieces.push({
                angleA: aA, angleB: aB,
                currentAngle: Math.random() * Math.PI * 2,
                orbitRadius: 60 + Math.random() * 150 + layerCount * 15,
                orbitSpeed: (0.006 + Math.random() * 0.014) * (Math.random() > 0.5 ? 1 : -1),
                selfRotation: 0,
                selfSpin: (0.02 + Math.random() * 0.035) * (Math.random() > 0.5 ? 1 : -1),
                currentRadius: 8, targetRadius: 0,
                opacity: 1, rect, cx, cy,
                expandProgress: 0, phase: 'expanding',
                returnProgress: 0, returnStartRadius: 0,
                homeX: cx, homeY: cy
            });
            pieces[i].targetRadius = pieces[i].orbitRadius;
        }
        const g = { pieces, offscreenCanvas, phase: 'expanding', age: 0, id: layerCount++, done: false };
        splitGroups.push(g);
        return g;
    }

    function returnLatestGroup() {
        for (let i = splitGroups.length - 1; i >= 0; i--) {
            const g = splitGroups[i];
            if (g.phase === 'returning' || g.done) continue;
            g.phase = 'returning';
            for (const p of g.pieces) { p.returnStartRadius = p.currentRadius; p.returnProgress = 0; p.homeX = p.cx + (Math.random() - 0.5) * 4; p.homeY = p.cy + (Math.random() - 0.5) * 4; }
            break;
        }
    }

    function drawSplitPieces() {
        for (let gi = 0; gi < splitGroups.length; gi++) {
            const group = splitGroups[gi];
            if (group.done) continue;
            group.age++;

            if (group.age > 1500 && group.phase === 'orbiting') {
                group.phase = 'returning';
                for (const p of group.pieces) { p.returnStartRadius = p.currentRadius; p.returnProgress = 0; }
            }

            let alive = false;
            for (const p of group.pieces) {
                if (p.opacity < 0.005) continue;
                alive = true;

                if (p.phase === 'expanding') {
                    p.expandProgress = Math.min(1, p.expandProgress + 0.025);
                    const e = 1 - Math.pow(1 - p.expandProgress, 3);
                    p.currentRadius = 8 + (p.targetRadius - 8) * e;
                    p.currentAngle += p.orbitSpeed * e;
                    p.selfRotation += p.selfSpin * e;
                    if (p.expandProgress >= 1) p.phase = 'orbiting';
                }
                if (p.phase === 'orbiting') { p.currentAngle += p.orbitSpeed; p.selfRotation += p.selfSpin; }
                if (p.phase === 'returning') {
                    p.returnProgress = Math.min(1, p.returnProgress + 0.018);
                    const e = 1 - Math.pow(1 - p.returnProgress, 3);
                    p.currentRadius = p.returnStartRadius * (1 - e);
                    p.currentAngle += p.orbitSpeed * (1 - e) * 0.4;
                    p.selfRotation += p.selfSpin * (1 - e) * 0.2;
                    p.opacity = Math.max(0, 1 - e);
                }

                const ox = p.cx + Math.cos(p.currentAngle) * p.currentRadius;
                const oy = p.cy + Math.sin(p.currentAngle) * p.currentRadius;

                ctx.save();
                ctx.globalAlpha = p.opacity;
                ctx.translate(ox, oy);
                ctx.rotate(p.selfRotation);
                ctx.beginPath(); ctx.moveTo(0, 0);
                ctx.arc(0, 0, p.rect.width * 1.5, p.angleA, p.angleB);
                ctx.closePath(); ctx.clip();
                ctx.translate(-p.cx, -p.cy);
                ctx.drawImage(group.offscreenCanvas, p.rect.left, p.rect.top, p.rect.width, p.rect.height);

                const tintHue = (group.id * 37) % 360;
                ctx.globalCompositeOperation = 'screen';
                ctx.fillStyle = `hsla(${tintHue}, 80%, 50%, ${0.08 + (group.id % 3) * 0.04})`;
                ctx.fillRect(p.rect.left, p.rect.top, p.rect.width, p.rect.height);
                ctx.globalCompositeOperation = 'source-over';
                ctx.restore();
            }
            if (!alive && group.phase === 'returning') { group.done = true; group.pieces = []; group.offscreenCanvas = null; }
        }
        splitGroups = splitGroups.filter(g => !g.done);
    }

    /* ---- 3D model ---- */
    let modelScene = null;

    function showStatueLady() {
        if (modelScene) return;
        try {
            modelScene = {};
            const scene = new THREE.Scene();
            // scene.background = new THREE.Color(0x0a0a0a);
            const camera = new THREE.PerspectiveCamera(45, modelContainer.clientWidth / modelContainer.clientHeight || 1, 0.1, 100);
            camera.position.set(0, 0.5, 3);
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(modelContainer.clientWidth || 800, modelContainer.clientHeight || 600);
            renderer.setPixelRatio(window.devicePixelRatio);
            modelContainer.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0x404060, 0.5);
            scene.add(ambient);
            const dl1 = new THREE.DirectionalLight(0xff4444, 1.2);
            dl1.position.set(2, 3, 4); scene.add(dl1);
            const dl2 = new THREE.DirectionalLight(0x4444ff, 1.0);
            dl2.position.set(-2, 1, 3); scene.add(dl2);

            const loader = new THREE.GLTFLoader();
            loader.load('./statueLadyExport1.glb', function(gltf) {
                const model = gltf.scene;
                // Wrap in a pivot group so rotation spins from center
                const pivot = new THREE.Group();
                scene.add(pivot);
                const box = new THREE.Box3().setFromObject(model);
                const ctr = box.getCenter(new THREE.Vector3());
                const sz = box.getSize(new THREE.Vector3());
                const scl = 2.0 / Math.max(sz.x, sz.y, sz.z);
                model.scale.set(scl, scl, scl);
                model.position.copy(ctr.clone().multiplyScalar(-scl));
                pivot.add(model);
                modelScene.model = pivot;
                const el = document.getElementById('modelLoading');
                if (el) el.style.display = 'none';
            }, undefined, function(err) { console.error('GLB error', err); });

            modelScene.scene = scene;
            modelScene.camera = camera;
            modelScene.renderer = renderer;

            function anim() {
                if (!modelScene || !modelScene.renderer) return;
                if (modelScene.model) { modelScene.model.rotation.y += 0.015; }
                modelScene.renderer.render(modelScene.scene, modelScene.camera);
                requestAnimationFrame(anim);
            }
            anim();

            function onResize() {
                if (!modelScene || !modelScene.renderer) return;
                modelScene.camera.aspect = modelContainer.clientWidth / modelContainer.clientHeight || 1;
                modelScene.camera.updateProjectionMatrix();
                modelScene.renderer.setSize(modelContainer.clientWidth || 800, modelContainer.clientHeight || 600);
            }
            window.addEventListener('resize', onResize);
            modelScene.onResize = onResize;
        } catch (e) { console.error('Three.js error', e); }
    }

    /* ---- click handler ---- */
    img.addEventListener('click', () => {
        clickCount++;

        /* hide 3D model on non-15 clicks */
        try {
            if (modelScene && modelOverlay.classList.contains('show') && clickCount % 15 !== 0) {
                modelOverlay.classList.remove('show');
                if (modelScene.renderer) {
                    modelScene.renderer.dispose();
                    if (modelScene.renderer.domElement && modelScene.renderer.domElement.parentNode) {
                        modelScene.renderer.domElement.parentNode.removeChild(modelScene.renderer.domElement);
                    }
                }
                if (modelScene.onResize) window.removeEventListener('resize', modelScene.onResize);
                modelScene = null;
            }
        } catch (e) { /* don't crash */ }

        hint.textContent = `👆 clicks: ${clickCount} ${clickCount % 10 === 0 ? '🔥 BONUS' : clickCount % 15 === 0 ? '🗿 LADY' : '| click'}`;

        /* fart */
        audio.currentTime = 0;
        audio.play().catch(function(){});

        /* click 10: bonus */
        if (clickCount % 10 === 0) {
            bonusAudio.currentTime = 0;
            bonusAudio.play().catch(function(){});
            bonusOverlay.classList.add('show');
            bonusLabel.classList.add('show');
            for (let i = 0; i < 8; i++) {
                (function(n) { setTimeout(function() {
                    var ox = (Math.random() - 0.5) * 50, oy = (Math.random() - 0.5) * 25;
                    ghostRed.style.transform = 'translate(' + ox + 'px,' + oy + 'px)';
                    ghostRed.style.opacity = Math.random() * 0.7 + 0.3;
                    ghostBlue.style.transform = 'translate(' + (-ox) + 'px,' + (-oy) + 'px)';
                    ghostBlue.style.opacity = Math.random() * 0.7 + 0.3;
                    img.style.filter = 'hue-rotate(' + (Math.random() * 360) + 'deg) contrast(' + (3 + Math.random() * 4) + ') brightness(' + (1.5 + Math.random() * 1.5) + ') saturate(' + (3 + Math.random() * 3) + ')';
                }, n * 40); })(i);
            }
            setTimeout(function() {
                ghostRed.style.transform = ''; ghostRed.style.opacity = '0';
                ghostBlue.style.transform = ''; ghostBlue.style.opacity = '0';
                img.style.filter = 'none';
            }, 700);
        }

        /* click 15: 3D model + its sound */
        if (clickCount % 15 === 0) {
            modelOverlay.classList.add('show');
            showStatueLady();
            modelAudio.currentTime = 0;
            modelAudio.play().catch(function(){});
        }

        /* mega glitch */
        for (let i = 0; i < 5; i++) {
            (function(n) { setTimeout(function() {
                var ox = (Math.random() - 0.5) * 30, oy = (Math.random() - 0.5) * 15;
                ghostRed.style.transform = 'translate(' + ox + 'px,' + oy + 'px)';
                ghostRed.style.opacity = Math.random() * 0.5 + 0.2;
                ghostBlue.style.transform = 'translate(' + (-ox) + 'px,' + (-oy) + 'px)';
                ghostBlue.style.opacity = Math.random() * 0.5 + 0.2;
                img.style.filter = 'hue-rotate(' + (Math.random() * 360) + 'deg) contrast(' + (2 + Math.random() * 3) + ') brightness(' + (1.2 + Math.random() * 0.8) + ') saturate(' + (2 + Math.random() * 2) + ')';
            }, n * 60); })(i);
        }
        setTimeout(function() {
            ghostRed.style.transform = ''; ghostRed.style.opacity = '0';
            ghostBlue.style.transform = ''; ghostBlue.style.opacity = '0';
            img.style.filter = 'none';
        }, 400);

        /* split layer */
        var newGroup = createSplitGroup();
        var depth = Math.min(splitGroups.length, 10);
        img.style.opacity = '' + Math.max(0.05, 1 - depth * 0.08);
    });

    /* fart ended: return latest layer */
    audio.addEventListener('ended', function() {
        returnLatestGroup();
        var active = splitGroups.filter(function(g) { return !g.done && g.phase !== 'returning'; }).length;
        img.style.opacity = '' + Math.max(0.1, 1 - active * 0.08);
    });

    /* bonus ended: return all layers */
    bonusAudio.addEventListener('ended', function() {
        splitGroups.forEach(function(g) {
            if (g.phase === 'returning' || g.done) return;
            g.phase = 'returning';
            g.pieces.forEach(function(p) { p.returnStartRadius = p.currentRadius; p.returnProgress = 0; p.homeX = p.cx + (Math.random()-0.5)*4; p.homeY = p.cy + (Math.random()-0.5)*4; });
        });
        bonusOverlay.classList.remove('show');
        bonusLabel.classList.remove('show');
        img.style.opacity = '0.8';
    });

    /* model sound ended: reset everything to original form */
    modelAudio.addEventListener('ended', function() {
        modelOverlay.classList.remove('show');
        if (modelScene) {
            if (modelScene.renderer) {
                modelScene.renderer.dispose();
                if (modelScene.renderer.domElement && modelScene.renderer.domElement.parentNode) {
                    modelScene.renderer.domElement.parentNode.removeChild(modelScene.renderer.domElement);
                }
            }
            if (modelScene.onResize) window.removeEventListener('resize', modelScene.onResize);
            modelScene = null;
        }
        /* wipe all split layers */
        splitGroups.forEach(function(g) { g.done = true; g.pieces = []; g.offscreenCanvas = null; });
        splitGroups = [];
        /* reset image */
        img.style.opacity = '1';
        img.style.filter = 'none';
        ghostRed.style.transform = ''; ghostRed.style.opacity = '0';
        ghostBlue.style.transform = ''; ghostBlue.style.opacity = '0';
        clickCount = 0;
        hint.textContent = '👆 click the statue';
    });

    /* ---- animation loop ---- */
    function loop() {
        ctx.clearRect(0, 0, W, H);
        drawGlitchBars();
        drawSplitPieces();
        drawSparkles();
        requestAnimationFrame(loop);
    }
    loop();
    </script>
</body>
</html>
