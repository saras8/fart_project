<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fart project</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            position: relative;
        }
        /* Scanlines */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.08) 2px,
                rgba(0,0,0,0.08) 4px
            );
            pointer-events: none;
            z-index: 10;
        }
        .container {
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }
        .statue-wrapper {
            position: relative;
            display: inline-block;
        }
        .statue {
            max-width: 90vw;
            max-height: 80vh;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            display: block;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        .statue:active {
            transform: scale(0.97);
        }
        .statue:hover {
            box-shadow: 0 12px 40px rgba(0,0,0,0.7);
        }
        /* Glitch ghosts */
        .glitch-ghost {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            pointer-events: none;
            z-index: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
        }
        .glitch-ghost--red {
            background-color: rgba(255,0,0,0.15);
            mix-blend-mode: screen;
        }
        .glitch-ghost--blue {
            background-color: rgba(0,0,255,0.15);
            mix-blend-mode: screen;
        }
        .hint {
            color: #888;
            margin-top: 1rem;
            font-size: 0.9rem;
            opacity: 0.7;
        }

        /* Sparkle canvas */
        #sparkles {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>
    <canvas id="sparkles"></canvas>

    <div class="container">
        <div class="statue-wrapper" id="statueWrapper">
            <div class="glitch-ghost glitch-ghost--red" id="ghostRed"></div>
            <div class="glitch-ghost glitch-ghost--blue" id="ghostBlue"></div>
            <img
                id="statue"
                class="statue"
                src="https://images.pdimagearchive.org/essays/the-spiralist/b28127833_0294-edit.jpg"
                alt="Statue — click to make a fart sound"
                draggable="false"
            />
        </div>
        <p class="hint">👆 click the statue</p>
    </div>

    <audio id="fartSound" preload="auto" src="https://cdn.freesound.org/previews/833/833105_17959155-lq.mp3"></audio>

    <script>
        const img = document.getElementById('statue');
        const audio = document.getElementById('fartSound');
        const ghostRed = document.getElementById('ghostRed');
        const ghostBlue = document.getElementById('ghostBlue');
        const wrapper = document.getElementById('statueWrapper');
        const canvas = document.getElementById('sparkles');
        const ctx = canvas.getContext('2d');

        let W, H;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // ─── Sparkle particles ───
        const sparkles = [];
        const SPARKLE_COUNT = 120;

        class Sparkle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * W;
                this.y = Math.random() * H;
                this.size = Math.random() * 4 + 1;
                this.speedX = (Math.random() - 0.5) * 3;
                this.speedY = (Math.random() - 0.5) * 3 + 1;
                this.life = Math.random() * 60 + 40;
                this.maxLife = this.life;
                this.hue = Math.random() > 0.5 ? 0 : 230; // red or blue
                this.glitch = false;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life--;

                // Random glitch teleport
                if (Math.random() < 0.005) {
                    this.x += (Math.random() - 0.5) * 200;
                    this.y += (Math.random() - 0.5) * 100;
                    this.glitch = true;
                } else {
                    this.glitch = false;
                }

                if (this.life <= 0 || this.x < -50 || this.x > W + 50 || this.y < -50 || this.y > H + 50) {
                    this.reset();
                    this.life = Math.random() * 60 + 40;
                }
            }
            draw() {
                const alpha = Math.max(0, this.life / this.maxLife);
                const size = this.glitch ? this.size * 3 : this.size;

                ctx.save();
                ctx.shadowBlur = this.glitch ? 20 : 10;
                ctx.shadowColor = this.hue === 0 ? `rgba(255,0,0,${alpha})` : `rgba(0,100,255,${alpha})`;

                // Cross shape
                ctx.strokeStyle = this.hue === 0
                    ? `rgba(255,${50 + Math.random()*50},${50 + Math.random()*50},${alpha})`
                    : `rgba(${50 + Math.random()*50},${100 + Math.random()*50},255,${alpha})`;
                ctx.lineWidth = 1.5;

                ctx.beginPath();
                ctx.moveTo(this.x - size, this.y);
                ctx.lineTo(this.x + size, this.y);
                ctx.moveTo(this.x, this.y - size);
                ctx.lineTo(this.x, this.y + size);
                ctx.stroke();

                // Center dot
                ctx.fillStyle = this.hue === 0
                    ? `rgba(255,50,50,${alpha})`
                    : `rgba(50,100,255,${alpha})`;
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(this.x, this.y, size * 0.3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        for (let i = 0; i < SPARKLE_COUNT; i++) {
            sparkles.push(new Sparkle());
        }

        // ─── Glitch timing ───
        let glitchActive = false;
        let glitchTimer = 0;

        function triggerGlitchBurst() {
            glitchActive = true;
            glitchTimer = 0;

            // Randomize ghost positions
            const offsetX = (Math.random() - 0.5) * 20;
            const offsetY = (Math.random() - 0.5) * 10;
            ghostRed.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
            ghostBlue.style.transform = `translate(${-offsetX}px, ${-offsetY}px)`;

            // Glitch out the image
            img.style.filter = `
                hue-rotate(${Math.random() * 360}deg)
                contrast(${1.5 + Math.random() * 2})
                brightness(${1 + Math.random() * 0.5})
            `;

            setTimeout(() => {
                glitchActive = false;
                ghostRed.style.transform = 'translate(0,0)';
                ghostBlue.style.transform = 'translate(0,0)';
                img.style.filter = 'none';
            }, 150 + Math.random() * 200);
        }

        // Random glitch every 1-4 seconds
        setInterval(() => {
            if (!glitchActive && Math.random() < 0.4) {
                triggerGlitchBurst();
            }
        }, 1000 + Math.random() * 3000);

        // ─── Fart trigger — mega glitch ───
        img.addEventListener('click', () => {
            audio.currentTime = 0;
            audio.play().catch(() => {});

            // Mega glitch burst
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const ox = (Math.random() - 0.5) * 30;
                    const oy = (Math.random() - 0.5) * 15;
                    ghostRed.style.transform = `translate(${ox}px,${oy}px)`;
                    ghostRed.style.opacity = Math.random() * 0.5 + 0.2;
                    ghostBlue.style.transform = `translate(${-ox}px,${-oy}px)`;
                    ghostBlue.style.opacity = Math.random() * 0.5 + 0.2;
                    img.style.filter = `
                        hue-rotate(${Math.random() * 360}deg)
                        contrast(${2 + Math.random() * 3})
                        brightness(${1.2 + Math.random() * 0.8})
                        saturate(${2 + Math.random() * 2})
                    `;
                }, i * 60);
            }
            setTimeout(() => {
                glitchActive = false;
                ghostRed.style.transform = 'translate(0,0)';
                ghostRed.style.opacity = '0';
                ghostBlue.style.transform = 'translate(0,0)';
                ghostBlue.style.opacity = '0';
                img.style.filter = 'none';
            }, 400);
        });

        // ─── Sparkle animation loop ───
        function animate() {
            ctx.clearRect(0, 0, W, H);

            // Every few frames: full-screen glitch line
            if (Math.random() < 0.02) {
                const y = Math.random() * H;
                const h = Math.random() * 4 + 1;
                const fill = ctx.createLinearGradient(0, y, W, y);
                fill.addColorStop(0, `rgba(255,0,0,${Math.random() * 0.3})`);
                fill.addColorStop(0.3, `rgba(255,0,0,0)`);
                fill.addColorStop(0.5, `rgba(0,100,255,${Math.random() * 0.3})`);
                fill.addColorStop(0.7, `rgba(0,100,255,0)`);
                fill.addColorStop(1, `rgba(255,0,0,${Math.random() * 0.3})`);
                ctx.fillStyle = fill;
                ctx.fillRect(0, y, W, h);
            }

            // Random colorful bars
            if (Math.random() < 0.01) {
                const y = Math.random() * H;
                const h = Math.random() * 3 + 1;
                ctx.fillStyle = Math.random() > 0.5
                    ? `rgba(255,0,0,${Math.random() * 0.15})`
                    : `rgba(0,100,255,${Math.random() * 0.15})`;
                ctx.fillRect(0, y, W, h);
            }

            for (const s of sparkles) {
                s.update();
                s.draw();
            }

            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
